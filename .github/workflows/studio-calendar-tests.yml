name: Studio calendar GAS checks

on:
  push:
    branches:
      - feature/bidirectional-sheet-calendar-20261120
    paths:
      - '*.gs'
      - '*.test.mjs'
      - 'scripts/package-crm-v2.mjs'
      - 'appsscript.json'
      - '.github/workflows/studio-calendar-tests.yml'
  pull_request:
    paths:
      - '*.gs'
      - '*.test.mjs'
      - 'appsscript.json'
      - '.github/workflows/studio-calendar-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gas-tests:
    name: Validate Apps Script and run regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check GAS source syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.gs; do
            node --check --input-type=commonjs < "$file"
          done
      - name: Run deterministic regression tests
        env:
          TZ: Europe/Moscow
        run: node --test *.test.mjs
      - name: Build isolated CRM v2 installation bundle
        run: node scripts/package-crm-v2.mjs
      - name: Upload installation bundle
        uses: actions/upload-artifact@v7
        with:
          name: crm-v2-test-install
          path: dist/crm-v2-test/
          if-no-files-found: error
          retention-days: 14
